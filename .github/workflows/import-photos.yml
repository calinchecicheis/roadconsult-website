# One-off: copies the project photos from the old WordPress site into the repo.
# Runs on push when the photo list changes; delete after the import.
name: Import photos from old site
on:
  push:
    branches: [claude/project-thread-xfhdz7]
    paths: [scripts/photos.txt, scripts/import_photos.py, .github/workflows/import-photos.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==11.0.0
      - run: python scripts/import_photos.py
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/projects src/data/photos.json
          git commit -m "Import project photos from the old site" || echo "nothing to commit"
          git push
